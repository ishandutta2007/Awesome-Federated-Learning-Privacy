<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <style>
      /* Dynamic Keyframe Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }

      @keyframes dataFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes nodeBlink {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      /* Animated Elements */
      .pulsing-hub {
        transform-origin: 600px 105px;
        animation: pulseGlow 4s ease-in-out infinite;
      }

      .flow-line {
        stroke-dasharray: 8 12;
        animation: dataFlow 2.5s linear infinite;
      }

      .flow-line-rev {
        stroke-dasharray: 8 12;
        animation: dataFlow 3s linear infinite reverse;
      }

      .radar-ring {
        transform-origin: 600px 105px;
        animation: orbitRotate 20s linear infinite;
      }

      .node-1 { transform-origin: 180px 80px; animation: nodeBlink 3s ease-in-out infinite; }
      .node-2 { transform-origin: 320px 150px; animation: nodeBlink 4s ease-in-out 0.8s infinite; }
      .node-3 { transform-origin: 880px 150px; animation: nodeBlink 3.5s ease-in-out 1.5s infinite; }
      .node-4 { transform-origin: 1020px 80px; animation: nodeBlink 4.2s ease-in-out 0.4s infinite; }
      .node-5 { transform-origin: 220px 240px; animation: nodeBlink 3.8s ease-in-out 1.2s infinite; }
      .node-6 { transform-origin: 980px 240px; animation: nodeBlink 3.6s ease-in-out 2s infinite; }

      .pill-hover {
        animation: floatCard 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern in Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Background Network Geometry & Dynamic Data Flow Lines -->
  <g opacity="0.65">
    <!-- Center Radial Glow -->
    <circle cx="600" cy="105" r="140" fill="url(#hubGlow)" class="pulsing-hub"/>

    <!-- Concentric Target Radar Circles -->
    <circle cx="600" cy="105" r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6" class="radar-ring"/>
    <circle cx="600" cy="105" r="115" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.15"/>

    <!-- Dynamic Flow Connectors from Distributed Nodes to Aggregation Hub -->
    <path d="M 180 80 Q 380 70 560 105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" class="flow-line"/>
    <path d="M 320 150 Q 450 140 560 115" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" class="flow-line-rev"/>
    <path d="M 220 240 Q 400 210 565 125" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.4" class="flow-line"/>

    <path d="M 1020 80 Q 820 70 640 105" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6" class="flow-line-rev"/>
    <path d="M 880 150 Q 750 140 640 115" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" class="flow-line"/>
    <path d="M 980 240 Q 800 210 635 125" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-opacity="0.4" class="flow-line-rev"/>

    <!-- Peripheral Client / Silo Nodes with Blinking Pulse -->
    <g class="node-1">
      <circle cx="180" cy="80" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
      <text x="180" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" font-weight="bold" text-anchor="middle">🏥 N1</text>
    </g>

    <g class="node-2">
      <circle cx="320" cy="150" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
      <text x="320" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc" font-weight="bold" text-anchor="middle">🏦 N2</text>
    </g>

    <g class="node-5">
      <circle cx="220" cy="240" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
      <text x="220" y="244" font-family="system-ui, sans-serif" font-size="9" fill="#7dd3fc" font-weight="bold" text-anchor="middle">📱 N3</text>
    </g>

    <g class="node-4">
      <circle cx="1020" cy="80" r="18" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#neonGlow)"/>
      <text x="1020" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#e879f9" font-weight="bold" text-anchor="middle">🔬 N4</text>
    </g>

    <g class="node-3">
      <circle cx="880" cy="150" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
      <text x="880" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc" font-weight="bold" text-anchor="middle">🏥 N5</text>
    </g>

    <g class="node-6">
      <circle cx="980" cy="240" r="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.6"/>
      <text x="980" y="244" font-family="system-ui, sans-serif" font-size="9" fill="#f0abfc" font-weight="bold" text-anchor="middle">🛡️ N6</text>
    </g>

    <!-- Central Aggregation Hub Icon / Cryptographic Shield (Behind Foreground Text) -->
    <g transform="translate(578, 80) scale(1.1)" filter="url(#neonGlow)">
      <polygon points="20,0 38,8 38,24 20,38 2,24 2,8" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2"/>
      <!-- Inner Lock Indicator -->
      <path d="M 16 17 L 16 13 C 16 10.8 17.8 9 20 9 C 22.2 9 24 10.8 24 13 L 24 17 M 13 17 L 27 17 L 27 27 L 13 27 Z" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Strictly foreground, crisp & high z-index) -->
  <g filter="url(#softShadow)">
    <!-- Top Meta Tag / Category Badge -->
    <g transform="translate(600, 148)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#0f172a" stroke="url(#cyberCyan)" stroke-width="1.5"/>
      <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Primary Title -->
    <text x="600" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" text-anchor="middle">Awesome Federated Learning &amp; Privacy</text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.3" text-anchor="middle">Decentralized AI • Privacy-Preserving ML • Differential Privacy • Healthcare &amp; Enterprise Governance</text>
  </g>

  <!-- Foreground Feature Badges / Interactive Pills -->
  <g class="pill-hover" transform="translate(600, 310)">
    <!-- Pill 1: Zero Raw Data Sharing -->
    <g transform="translate(-320, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#111827" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#34d399" text-anchor="middle">🔒 Zero Raw Data Sharing</text>
    </g>

    <!-- Pill 2: Healthcare & Regulated Silos -->
    <g transform="translate(0, 0)">
      <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">🏥 Healthcare (HIPAA &amp; GDPR)</text>
    </g>

    <!-- Pill 3: Production & Research Standard -->
    <g transform="translate(320, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#111827" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#d8b4fe" text-anchor="middle">⚡ Open-Source &amp; Cloud SaaS</text>
    </g>
  </g>

  <!-- Outer Stroke Border -->
  <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
</svg>
